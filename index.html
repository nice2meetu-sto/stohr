<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>마일리지 관리 시스템</title>
  <style>
    /* ===== CSS VARIABLES ===== */
    :root {
      --primary: #343B68;
      --primary-dark: #252B4E;
      --primary-light: #4A5490;
      --blue: #0A57CC;
      --blue-light: #3A7FEE;
      --red: #C0392B;
      --red-light: #E74C3C;
      --orange: #E67E22;
      --orange-light: #F39C12;
      --yellow: #F1C40F;
      --yellow-light: #F9E44A;
      --green: #27AE60;
      --green-light: #2ECC71;
      --gray: #95A5A6;
      --gray-light: #BDC3C7;
      --gray-dark: #7F8C8D;
      --bg: #F0F2F8;
      --bg-card: #FFFFFF;
      --bg-sidebar: #FFFFFF;
      --text: #2C3E50;
      --text-muted: #6C7A89;
      --text-light: #95A5A6;
      --border: #E0E4F0;
      --border-light: #ECF0F5;
      --shadow: 0 2px 8px rgba(52, 59, 104, 0.10);
      --shadow-md: 0 4px 16px rgba(52, 59, 104, 0.14);
      --shadow-lg: 0 8px 32px rgba(52, 59, 104, 0.18);
      --radius: 10px;
      --radius-sm: 6px;
      --radius-lg: 16px;
      --sidebar-width: 250px;
      --header-height: 60px;
      --transition: 0.18s ease;
    }

    /* ===== RESET ===== */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      font-family: 'Segoe UI', 'Malgun Gothic', 'Apple SD Gothic Neo', Arial, sans-serif;
      font-size: 14px;
      color: var(--text);
      background: var(--bg);
      line-height: 1.5;
    }

    a {
      color: var(--blue);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    ul, ol {
      list-style: none;
    }

    button {
      cursor: pointer;
      font-family: inherit;
    }

    input, select, textarea {
      font-family: inherit;
      font-size: 14px;
    }

    /* ===== APP HEADER ===== */
    .app-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: var(--header-height);
      background: var(--primary);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,0.18);
    }

    .app-header-title {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.3px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .app-header-title .header-icon {
      font-size: 22px;
    }

    .app-header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .app-header-actions .btn {
      font-size: 13px;
      padding: 6px 14px;
    }

    /* ===== LAYOUT ===== */
    body {
      display: flex;
      flex-direction: column;
    }

    .app-container {
      display: flex;
      margin-top: var(--header-height);
      min-height: calc(100vh - var(--header-height));
    }

    /* ===== SIDEBAR ===== */
    .sidebar {
      width: var(--sidebar-width);
      min-width: var(--sidebar-width);
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 18px 0 24px;
      position: fixed;
      top: var(--header-height);
      bottom: 0;
      left: 0;
      overflow-y: auto;
      z-index: 90;
      box-shadow: 2px 0 8px rgba(52,59,104,0.05);
    }

    .sidebar-section-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-light);
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 10px 20px 6px;
      margin-top: 8px;
    }

    .sidebar-section-label:first-child {
      margin-top: 0;
    }

    .sidebar-divider {
      height: 1px;
      background: var(--border);
      margin: 10px 16px;
    }

    .sidebar-tab {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 20px;
      cursor: pointer;
      border-radius: var(--radius-sm);
      margin: 2px 10px;
      font-size: 14px;
      color: var(--text-muted);
      font-weight: 500;
      transition: background var(--transition), color var(--transition);
      user-select: none;
      border: none;
      background: none;
      width: calc(100% - 20px);
      text-align: left;
    }

    .sidebar-tab:hover {
      background: var(--bg);
      color: var(--primary);
    }

    .sidebar-tab.active {
      background: linear-gradient(90deg, rgba(52,59,104,0.12) 0%, rgba(52,59,104,0.05) 100%);
      color: var(--primary);
      font-weight: 700;
      border-left: 3px solid var(--primary);
      padding-left: 17px;
    }

    .sidebar-tab .tab-icon {
      font-size: 16px;
      min-width: 20px;
      text-align: center;
    }

    .sidebar-tab .tab-badge {
      margin-left: auto;
      background: var(--red);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      border-radius: 10px;
      padding: 1px 7px;
      min-width: 20px;
      text-align: center;
    }

    /* DB mode sidebar hidden by default */
    .sidebar-db-section {
      display: none;
    }

    /* ===== MAIN CONTENT ===== */
    .main-content {
      flex: 1;
      margin-left: var(--sidebar-width);
      padding: 28px 28px 40px;
      min-height: calc(100vh - var(--header-height));
      background: var(--bg);
    }

    /* ===== PAGE SECTIONS ===== */
    .page-section {
      display: none;
    }

    .page-section.active {
      display: block;
    }

    /* ===== BREADCRUMB ===== */
    .breadcrumb {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 18px;
    }

    .breadcrumb .breadcrumb-sep {
      color: var(--border);
    }

    .breadcrumb .breadcrumb-current {
      color: var(--primary);
      font-weight: 600;
    }

    /* ===== PAGE TITLE / TOOLBAR ===== */
    .page-title-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      gap: 12px;
      flex-wrap: wrap;
    }

    .page-title {
      font-size: 20px;
      font-weight: 700;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .page-subtitle {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* ===== FILTER ROW ===== */
    .filter-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .filter-row .filter-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      white-space: nowrap;
    }

    /* ===== SEARCH INPUT ===== */
    .search-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-icon {
      position: absolute;
      left: 10px;
      font-size: 15px;
      color: var(--text-light);
      pointer-events: none;
      line-height: 1;
    }

    .search-input {
      padding: 8px 12px 8px 34px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 14px;
      background: #fff;
      color: var(--text);
      outline: none;
      transition: border-color var(--transition), box-shadow var(--transition);
      min-width: 220px;
    }

    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(52,59,104,0.10);
    }

    .search-input::placeholder {
      color: var(--text-light);
    }

    /* ===== CARDS ===== */
    .card {
      background: var(--bg-card);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      padding: 20px 22px;
      margin-bottom: 20px;
    }

    .card-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    /* ===== STATS CARDS ===== */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 16px;
      margin-bottom: 22px;
    }

    .stat-card {
      background: var(--bg-card);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .stat-card-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .stat-card-value {
      font-size: 26px;
      font-weight: 800;
      color: var(--primary);
      line-height: 1.1;
    }

    .stat-card-sub {
      font-size: 12px;
      color: var(--text-light);
    }

    .stat-card.stat-red .stat-card-value { color: var(--red); }
    .stat-card.stat-orange .stat-card-value { color: var(--orange); }
    .stat-card.stat-green .stat-card-value { color: var(--green); }
    .stat-card.stat-blue .stat-card-value { color: var(--blue); }

    /* ===== AIRLINE CARDS ===== */
    .airline-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 14px;
      margin-bottom: 20px;
    }

    .airline-card {
      background: var(--bg-card);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      padding: 16px 18px;
      cursor: pointer;
      transition: box-shadow var(--transition), transform var(--transition), border-color var(--transition);
    }

    .airline-card:hover {
      box-shadow: var(--shadow-md);
      transform: translateY(-2px);
      border-color: var(--primary-light);
    }

    .airline-card.active {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(52,59,104,0.18), var(--shadow);
    }

    .airline-card-name {
      font-size: 15px;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 6px;
    }

    .airline-card-miles {
      font-size: 22px;
      font-weight: 800;
      color: var(--blue);
    }

    .airline-card-sub {
      font-size: 12px;
      color: var(--text-light);
      margin-top: 2px;
    }

    /* ===== EXPIRY CARDS ===== */
    .expiry-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 14px;
      margin-bottom: 20px;
    }

    .expiry-card {
      border-radius: var(--radius);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      transition: box-shadow var(--transition), transform var(--transition);
    }

    .expiry-card:hover {
      box-shadow: var(--shadow-md);
      transform: translateY(-2px);
    }

    .expiry-card.expiry-red {
      background: #FEF0EF;
      border-color: #F5B7B1;
    }

    .expiry-card.expiry-orange {
      background: #FEF5EA;
      border-color: #FAD7A0;
    }

    .expiry-card.expiry-yellow {
      background: #FEFDE7;
      border-color: #F9E44A;
    }

    .expiry-card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 6px;
    }

    .expiry-card-name {
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
    }

    .expiry-card-airline {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      background: var(--bg);
      border-radius: 4px;
      padding: 1px 6px;
    }

    .expiry-card-miles {
      font-size: 20px;
      font-weight: 800;
      color: var(--primary);
    }

    .expiry-card-date {
      font-size: 12px;
      color: var(--text-muted);
    }

    .expiry-card.expiry-red .expiry-card-miles { color: var(--red); }
    .expiry-card.expiry-orange .expiry-card-miles { color: var(--orange); }
    .expiry-card.expiry-yellow .expiry-card-miles { color: #B7950B; }

    /* ===== PERSON CARD GRID ===== */
    .person-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 14px;
      margin-bottom: 20px;
    }

    .person-card {
      background: var(--bg-card);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      padding: 16px 18px;
      cursor: pointer;
      transition: box-shadow var(--transition), transform var(--transition), border-color var(--transition);
      text-align: center;
    }

    .person-card:hover {
      box-shadow: var(--shadow-md);
      transform: translateY(-2px);
      border-color: var(--primary-light);
    }

    .person-card-avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--primary);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 700;
      margin: 0 auto 10px;
    }

    .person-card-name {
      font-size: 14px;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 4px;
    }

    .person-card-dept {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .person-card-miles {
      font-size: 16px;
      font-weight: 800;
      color: var(--blue);
    }

    /* ===== TABLES ===== */
    .table-wrapper {
      overflow-x: auto;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      background: var(--bg-card);
    }

    .data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      min-width: 600px;
    }

    .data-table thead {
      background: var(--primary);
      color: #fff;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .data-table thead th {
      padding: 11px 14px;
      font-weight: 600;
      text-align: left;
      white-space: nowrap;
      font-size: 12px;
      letter-spacing: 0.3px;
      border-right: 1px solid rgba(255,255,255,0.10);
    }

    .data-table thead th:last-child {
      border-right: none;
    }

    .data-table thead th.sortable {
      cursor: pointer;
      user-select: none;
    }

    .data-table thead th.sortable:hover {
      background: var(--primary-dark);
    }

    .data-table tbody tr {
      border-bottom: 1px solid var(--border-light);
      transition: background var(--transition);
    }

    .data-table tbody tr:last-child {
      border-bottom: none;
    }

    .data-table tbody tr:hover {
      background: rgba(52,59,104,0.04);
    }

    .data-table tbody td {
      padding: 9px 14px;
      vertical-align: middle;
      color: var(--text);
    }

    .data-table tbody td.td-actions {
      white-space: nowrap;
      text-align: right;
    }

    /* Row color classes */
    .data-table tbody tr.row-red td {
      background: #FEF0EF;
    }

    .data-table tbody tr.row-red:hover td {
      background: #fde0dd;
    }

    .data-table tbody tr.row-orange td {
      background: #FEF5EA;
    }

    .data-table tbody tr.row-orange:hover td {
      background: #fdecd6;
    }

    .data-table tbody tr.row-yellow td {
      background: #FEFDE7;
    }

    .data-table tbody tr.row-yellow:hover td {
      background: #fdf9c4;
    }

    .data-table tbody tr.row-gray td {
      background: #F5F6FA;
      color: var(--text-light);
    }

    .data-table tbody tr.row-strikethrough td {
      text-decoration: line-through;
      color: var(--text-light);
      background: #F5F6FA;
    }

    .data-table .td-num {
      text-align: right;
      font-variant-numeric: tabular-nums;
      font-weight: 600;
    }

    .data-table .td-center {
      text-align: center;
    }

    .data-table .td-tag {
      white-space: nowrap;
    }

    .data-table .empty-row td {
      text-align: center;
      padding: 40px;
      color: var(--text-light);
      font-size: 15px;
    }

    /* ===== BADGES / TAGS ===== */
    .badge {
      display: inline-block;
      border-radius: 4px;
      padding: 1px 7px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.3px;
    }

    .badge-red     { background: #FADBD8; color: var(--red); }
    .badge-orange  { background: #FAE5D3; color: #A04000; }
    .badge-yellow  { background: #FDEBD0; color: #7D6608; }
    .badge-green   { background: #D5F5E3; color: #1E8449; }
    .badge-blue    { background: #D6EAF8; color: #1A5276; }
    .badge-gray    { background: #EAECEE; color: var(--gray-dark); }
    .badge-primary { background: rgba(52,59,104,0.12); color: var(--primary); }

    /* ===== MODAL ===== */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(30, 34, 60, 0.45);
      z-index: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .modal-overlay.show {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-box {
      background: #fff;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      width: 100%;
      max-width: 560px;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      transform: translateY(16px) scale(0.98);
      transition: transform 0.2s ease;
    }

    .modal-overlay.show .modal-box {
      transform: translateY(0) scale(1);
    }

    .modal-box.modal-lg {
      max-width: 760px;
    }

    .modal-box.modal-sm {
      max-width: 400px;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 22px 14px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .modal-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .modal-close {
      background: none;
      border: none;
      font-size: 20px;
      color: var(--text-light);
      cursor: pointer;
      line-height: 1;
      padding: 4px;
      border-radius: 4px;
      transition: color var(--transition), background var(--transition);
    }

    .modal-close:hover {
      color: var(--red);
      background: #FEF0EF;
    }

    .modal-body {
      padding: 20px 22px;
      overflow-y: auto;
      flex: 1;
    }

    .modal-footer {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      padding: 14px 22px 18px;
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }

    /* ===== BUTTONS ===== */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 18px;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background var(--transition), box-shadow var(--transition), transform var(--transition);
      white-space: nowrap;
      text-decoration: none;
      line-height: 1.4;
      outline: none;
    }

    .btn:active {
      transform: translateY(1px);
    }

    .btn:disabled,
    .btn[disabled] {
      opacity: 0.55;
      cursor: not-allowed;
      pointer-events: none;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
    }

    .btn-primary:hover {
      background: var(--primary-dark);
      box-shadow: 0 2px 8px rgba(52,59,104,0.20);
    }

    .btn-blue {
      background: var(--blue);
      color: #fff;
    }

    .btn-blue:hover {
      background: #0947A8;
      box-shadow: 0 2px 8px rgba(10,87,204,0.20);
    }

    .btn-danger {
      background: var(--red);
      color: #fff;
    }

    .btn-danger:hover {
      background: #A93226;
      box-shadow: 0 2px 8px rgba(192,57,43,0.20);
    }

    .btn-secondary {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      background: #E8ECF4;
      border-color: var(--gray-light);
    }

    .btn-success {
      background: var(--green);
      color: #fff;
    }

    .btn-success:hover {
      background: #1E8449;
      box-shadow: 0 2px 8px rgba(39,174,96,0.20);
    }

    .btn-orange {
      background: var(--orange);
      color: #fff;
    }

    .btn-orange:hover {
      background: #CA6F1E;
      box-shadow: 0 2px 8px rgba(230,126,34,0.20);
    }

    .btn-sm {
      padding: 4px 10px;
      font-size: 12px;
      border-radius: 4px;
    }

    .btn-icon {
      padding: 7px;
      border-radius: var(--radius-sm);
    }

    .btn-outline-primary {
      background: transparent;
      border: 1.5px solid var(--primary);
      color: var(--primary);
    }

    .btn-outline-primary:hover {
      background: rgba(52,59,104,0.07);
    }

    /* ===== FORM ELEMENTS ===== */
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px 18px;
      margin-bottom: 0;
    }

    .form-row-3 {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 14px 18px;
    }

    .form-row-full {
      grid-column: 1 / -1;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin-bottom: 14px;
    }

    .form-group:last-child {
      margin-bottom: 0;
    }

    .form-label {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .form-label .required {
      color: var(--red);
      margin-left: 3px;
    }

    .form-input,
    .form-select,
    .form-textarea {
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 14px;
      color: var(--text);
      background: #fff;
      outline: none;
      transition: border-color var(--transition), box-shadow var(--transition);
      width: 100%;
    }

    .form-input:focus,
    .form-select:focus,
    .form-textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(52,59,104,0.10);
    }

    .form-input::placeholder,
    .form-textarea::placeholder {
      color: var(--text-light);
    }

    .form-input:read-only,
    .form-input[readonly] {
      background: var(--bg);
      color: var(--text-muted);
    }

    .form-textarea {
      resize: vertical;
      min-height: 72px;
    }

    .form-select {
      cursor: pointer;
    }

    .form-hint {
      font-size: 11px;
      color: var(--text-light);
      margin-top: 2px;
    }

    .form-error {
      font-size: 11px;
      color: var(--red);
      margin-top: 2px;
    }

    .form-divider {
      border: none;
      border-top: 1px solid var(--border);
      margin: 16px 0;
    }

    /* ===== CHECKBOX ===== */
    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }

    .checkbox-group input[type="checkbox"] {
      appearance: none;
      -webkit-appearance: none;
      width: 17px;
      height: 17px;
      border: 2px solid var(--border);
      border-radius: 4px;
      background: #fff;
      cursor: pointer;
      position: relative;
      transition: border-color var(--transition), background var(--transition);
      flex-shrink: 0;
    }

    .checkbox-group input[type="checkbox"]:checked {
      background: var(--primary);
      border-color: var(--primary);
    }

    .checkbox-group input[type="checkbox"]:checked::after {
      content: '';
      position: absolute;
      left: 3px;
      top: 1px;
      width: 7px;
      height: 10px;
      border: 2px solid #fff;
      border-top: none;
      border-left: none;
      transform: rotate(45deg);
    }

    .checkbox-group label {
      font-size: 14px;
      cursor: pointer;
      user-select: none;
    }

    /* ===== TOAST NOTIFICATIONS ===== */
    .toast-container {
      position: fixed;
      bottom: 28px;
      right: 28px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 10px;
      pointer-events: none;
    }

    .toast {
      background: var(--primary);
      color: #fff;
      border-radius: var(--radius);
      padding: 12px 18px;
      font-size: 14px;
      font-weight: 500;
      box-shadow: var(--shadow-lg);
      max-width: 340px;
      display: flex;
      align-items: center;
      gap: 10px;
      opacity: 0;
      transform: translateX(30px);
      transition: opacity 0.25s ease, transform 0.25s ease;
      pointer-events: auto;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(0);
    }

    .toast.hide {
      opacity: 0;
      transform: translateX(30px);
    }

    .toast-icon {
      font-size: 18px;
      flex-shrink: 0;
    }

    .toast-message {
      flex: 1;
      line-height: 1.4;
    }

    .toast-error   { background: var(--red); }
    .toast-success { background: var(--green); }
    .toast-warning { background: var(--orange); }
    .toast-info    { background: var(--blue); }

    /* ===== LOADING SPINNER ===== */
    .spinner-overlay {
      position: fixed;
      inset: 0;
      background: rgba(255,255,255,0.72);
      z-index: 9000;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 14px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .spinner-overlay.show {
      opacity: 1;
      pointer-events: auto;
    }

    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    .spinner-text {
      font-size: 14px;
      color: var(--primary);
      font-weight: 600;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ===== BAR CHART ===== */
    .chart-container {
      background: var(--bg-card);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      padding: 20px 22px;
      margin-bottom: 20px;
    }

    .chart-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 16px;
    }

    .bar-chart {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .bar-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .bar-label {
      min-width: 80px;
      font-size: 12px;
      color: var(--text-muted);
      text-align: right;
      font-weight: 600;
      flex-shrink: 0;
    }

    .bar-track {
      flex: 1;
      height: 18px;
      background: var(--bg);
      border-radius: 9px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      border-radius: 9px;
      background: var(--primary);
      transition: width 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    .bar-value {
      min-width: 56px;
      font-size: 12px;
      font-weight: 700;
      color: var(--primary);
    }

    /* ===== CONTENT TABS (inline tabs inside content area) ===== */
    .content-tabs {
      display: flex;
      gap: 4px;
      border-bottom: 2px solid var(--border);
      margin-bottom: 18px;
    }

    .content-tab-btn {
      padding: 8px 16px;
      border: none;
      background: none;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
      border-radius: var(--radius-sm) var(--radius-sm) 0 0;
      transition: color var(--transition), border-color var(--transition), background var(--transition);
    }

    .content-tab-btn:hover {
      color: var(--primary);
      background: rgba(52,59,104,0.04);
    }

    .content-tab-btn.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }

    /* ===== PAGINATION ===== */
    .pagination {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      margin-top: 18px;
      padding-top: 14px;
    }

    .pagination-info {
      font-size: 13px;
      color: var(--text-muted);
      margin-right: 10px;
    }

    .pagination-btn {
      min-width: 32px;
      height: 32px;
      padding: 0 8px;
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background var(--transition), color var(--transition), border-color var(--transition);
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .pagination-btn:hover:not(:disabled) {
      background: var(--bg);
      border-color: var(--primary);
      color: var(--primary);
    }

    .pagination-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .pagination-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* ===== SCROLL AREA ===== */
    .scroll-area {
      max-height: 340px;
      overflow-y: auto;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
    }

    .scroll-area::-webkit-scrollbar {
      width: 6px;
    }

    .scroll-area::-webkit-scrollbar-track {
      background: var(--bg);
    }

    .scroll-area::-webkit-scrollbar-thumb {
      background: var(--gray-light);
      border-radius: 3px;
    }

    .scroll-area::-webkit-scrollbar-thumb:hover {
      background: var(--gray);
    }

    /* ===== INFO GRID (inside modals / detail views) ===== */
    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px 18px;
      margin-bottom: 14px;
    }

    .info-item-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-light);
      text-transform: uppercase;
      letter-spacing: 0.4px;
      margin-bottom: 2px;
    }

    .info-item-value {
      font-size: 14px;
      color: var(--text);
      font-weight: 500;
    }

    .info-item-value.value-large {
      font-size: 20px;
      font-weight: 800;
      color: var(--primary);
    }

    /* ===== ADMIN MODE INDICATOR ===== */
    .admin-indicator {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(255,255,255,0.15);
      border-radius: var(--radius-sm);
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 700;
      color: #FFD700;
      border: 1px solid rgba(255,215,0,0.35);
    }

    .admin-indicator.hidden { display: none !important; }

    /* ===== PASSWORD MODAL SPECIAL ===== */
    .pw-modal-box {
      max-width: 360px;
    }

    .pw-logo {
      text-align: center;
      font-size: 36px;
      margin-bottom: 10px;
    }

    .pw-title {
      text-align: center;
      font-size: 18px;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 6px;
    }

    .pw-sub {
      text-align: center;
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 20px;
    }

    /* ===== MISC UTILITIES ===== */
    .text-red    { color: var(--red) !important; }
    .text-orange { color: var(--orange) !important; }
    .text-yellow { color: #B7950B !important; }
    .text-green  { color: var(--green) !important; }
    .text-blue   { color: var(--blue) !important; }
    .text-muted  { color: var(--text-muted) !important; }
    .text-light  { color: var(--text-light) !important; }
    .text-bold   { font-weight: 700 !important; }
    .text-right  { text-align: right !important; }
    .text-center { text-align: center !important; }
    .mt-0  { margin-top: 0 !important; }
    .mt-8  { margin-top: 8px !important; }
    .mt-16 { margin-top: 16px !important; }
    .mb-0  { margin-bottom: 0 !important; }
    .mb-8  { margin-bottom: 8px !important; }
    .mb-16 { margin-bottom: 16px !important; }
    .d-flex        { display: flex; }
    .align-center  { align-items: center; }
    .justify-between { justify-content: space-between; }
    .gap-8  { gap: 8px; }
    .gap-12 { gap: 12px; }
    .flex-1 { flex: 1; }
    .w-full { width: 100%; }
    .hidden  { display: none !important; }
    .nowrap  { white-space: nowrap; }
    .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 900px) {
      .sidebar {
        width: 200px;
        min-width: 200px;
      }

      .main-content {
        margin-left: 200px;
        padding: 18px 16px 30px;
      }

      .form-row {
        grid-template-columns: 1fr;
      }

      .form-row-3 {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width: 680px) {
      .sidebar {
        display: none;
      }

      .main-content {
        margin-left: 0;
        padding: 16px 12px 24px;
      }

      .stats-grid {
        grid-template-columns: 1fr 1fr;
      }

      .form-row-3 {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <!-- ===== APP HEADER ===== -->
  <header class="app-header">
    <div class="app-header-title">
      <span class="header-icon">&#9992;</span>
      마일리지 관리 시스템
    </div>
    <div class="app-header-actions">
      <span class="admin-indicator hidden" id="admin-indicator">&#128273; 관리자 모드</span>
      <button class="btn btn-secondary btn-sm" id="btn-open-sheet"
        onclick="window.open('https://docs.google.com/spreadsheets/d/1CoLUko6l086qPaIuBTPw1tYfc2Kk9EpVbpgpEviN4Uw/edit','_blank')">
        &#128202; 시트 열기
      </button>
      <button class="btn btn-sm" id="btn-admin-toggle"
        style="background:rgba(255,255,255,0.15);color:#fff;border:1px solid rgba(255,255,255,0.3);">
        &#128274; 관리자
      </button>
      <button class="btn btn-secondary btn-sm" id="btn-refresh">
        &#128260; 새로고침
      </button>
    </div>
  </header>

  <!-- ===== APP CONTAINER ===== -->
  <div class="app-container">

    <!-- ===== SIDEBAR ===== -->
    <aside class="sidebar" id="sidebar">

      <!-- VIEW MODE SECTION -->
      <div class="sidebar-view-section" id="sidebar-view-section">
        <div class="sidebar-section-label">조회 메뉴</div>

        <button class="sidebar-tab active" data-tab="tab-search" data-page="page-view" id="stab-search">
          <span class="tab-icon">&#128269;</span>
          마일리지 조회
        </button>

        <button class="sidebar-tab" data-tab="tab-expiry" data-page="page-view" id="stab-expiry">
          <span class="tab-icon">&#9201;</span>
          만료 예정
          <span class="tab-badge hidden" id="badge-expiry">0</span>
        </button>

        <button class="sidebar-tab" data-tab="tab-airline-stats" data-page="page-view" id="stab-airline-stats">
          <span class="tab-icon">&#128202;</span>
          항공사별 통계
        </button>

        <button class="sidebar-tab" data-tab="tab-trip-stats" data-page="page-view" id="stab-trip-stats">
          <span class="tab-icon">&#128506;</span>
          출장 통계
        </button>
      </div>

      <!-- DB MODE SECTION (hidden by default, shown when admin logged in) -->
      <div class="sidebar-db-section" id="sidebar-db-section">
        <div class="sidebar-divider"></div>
        <div class="sidebar-section-label">DB 관리</div>

        <button class="sidebar-tab" data-tab="tab-db-mileage" data-page="page-db" id="stab-db-mileage">
          <span class="tab-icon">&#9992;</span>
          마일리지 DB
        </button>

        <button class="sidebar-tab" data-tab="tab-db-trip" data-page="page-db" id="stab-db-trip">
          <span class="tab-icon">&#128203;</span>
          출장 DB
        </button>

        <button class="sidebar-tab" data-tab="tab-db-person" data-page="page-db" id="stab-db-person">
          <span class="tab-icon">&#128100;</span>
          인원 DB
        </button>
      </div>

    </aside><!-- /.sidebar -->

    <!-- ===== MAIN CONTENT ===== -->
    <main class="main-content" id="main-content">

      <!-- ===== VIEW PAGE ===== -->
      <div class="page-section active" id="page-view">

        <!-- Tab: 마일리지 조회 -->
        <div class="page-section active" id="tab-search">
          <!-- Populated by JS -->
        </div>

        <!-- Tab: 만료 예정 -->
        <div class="page-section" id="tab-expiry">
          <!-- Populated by JS -->
        </div>

        <!-- Tab: 항공사별 통계 -->
        <div class="page-section" id="tab-airline-stats">
          <!-- Populated by JS -->
        </div>

        <!-- Tab: 출장 통계 -->
        <div class="page-section" id="tab-trip-stats">
          <!-- Populated by JS -->
        </div>

      </div><!-- /#page-view -->

      <!-- ===== DB PAGE (hidden by default) ===== -->
      <div class="page-section" id="page-db">

        <!-- Tab: 마일리지 DB -->
        <div class="page-section" id="tab-db-mileage">
          <!-- Populated by JS -->
        </div>

        <!-- Tab: 출장 DB -->
        <div class="page-section" id="tab-db-trip">
          <!-- Populated by JS -->
        </div>

        <!-- Tab: 인원 DB -->
        <div class="page-section" id="tab-db-person">
          <!-- Populated by JS -->
        </div>

      </div><!-- /#page-db -->

    </main><!-- /.main-content -->

  </div><!-- /.app-container -->

  <!-- ===================================================================
       MODALS
  =================================================================== -->

  <!-- Password Modal -->
  <div class="modal-overlay" id="modal-password">
    <div class="modal-box pw-modal-box">
      <div class="modal-body" style="padding:30px 28px 24px;">
        <div class="pw-logo">&#128273;</div>
        <div class="pw-title">관리자 로그인</div>
        <div class="pw-sub">DB 관리 기능에 접근하려면 비밀번호를 입력하세요.</div>
        <div class="form-group" style="margin-bottom:0;">
          <label class="form-label">비밀번호</label>
          <input type="password" class="form-input" id="pw-input"
            placeholder="비밀번호 입력" autocomplete="current-password" />
          <div class="form-error hidden" id="pw-error">비밀번호가 올바르지 않습니다.</div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="btn-pw-cancel">취소</button>
        <button class="btn btn-primary" id="btn-pw-confirm">&#128275; 로그인</button>
      </div>
    </div>
  </div>

  <!-- Add / Edit Mileage Modal -->
  <div class="modal-overlay" id="modal-mileage">
    <div class="modal-box modal-lg">
      <div class="modal-header">
        <div class="modal-title" id="modal-mileage-title">&#9992; 마일리지 추가</div>
        <button class="modal-close" data-modal="modal-mileage">&#x2715;</button>
      </div>
      <div class="modal-body">
        <form id="form-mileage" autocomplete="off">
          <input type="hidden" id="f-mile-id" />
          <div class="form-row">

            <div class="form-group">
              <label class="form-label">출장자 <span class="required">*</span></label>
              <input type="text" class="form-input" id="f-mile-traveler"
                placeholder="출장자 이름" list="list-travelers" />
              <datalist id="list-travelers"></datalist>
            </div>

            <div class="form-group">
              <label class="form-label">출발일 <span class="required">*</span></label>
              <input type="date" class="form-input" id="f-mile-depart-date" />
            </div>

            <div class="form-group">
              <label class="form-label">출장명</label>
              <input type="text" class="form-input" id="f-mile-trip-title"
                placeholder="출장명" list="list-trips" />
              <datalist id="list-trips"></datalist>
            </div>

            <div class="form-group">
              <label class="form-label">항공사 <span class="required">*</span></label>
              <input type="text" class="form-input" id="f-mile-airline"
                placeholder="예: 대한항공, 아시아나" list="list-airlines" />
              <datalist id="list-airlines"></datalist>
            </div>

            <div class="form-group">
              <label class="form-label">적립 마일리지 <span class="required">*</span></label>
              <input type="number" class="form-input" id="f-mile-mileage"
                placeholder="0" min="0" />
            </div>

            <div class="form-group">
              <label class="form-label">사용가능 마일리지</label>
              <input type="number" class="form-input" id="f-mile-available"
                placeholder="0" min="0" />
            </div>

            <div class="form-group">
              <label class="form-label">만료일</label>
              <input type="date" class="form-input" id="f-mile-expire-date" />
            </div>

            <div class="form-group">
              <label class="form-label">유효여부</label>
              <select class="form-select" id="f-mile-is-valid">
                <option value="유효">유효</option>
                <option value="무효">무효</option>
              </select>
            </div>

            <div class="form-group">
              <label class="form-label">마일리지 구분</label>
              <select class="form-select" id="f-mile-category">
                <option value="">-- 선택 --</option>
                <option value="적립">적립</option>
                <option value="사용">사용</option>
                <option value="이월">이월</option>
              </select>
            </div>

            <div class="form-group">
              <label class="form-label">출처</label>
              <input type="text" class="form-input" id="f-mile-source"
                placeholder="출처 정보" />
            </div>

            <div class="form-group form-row-full">
              <label class="form-label">메모</label>
              <textarea class="form-textarea" id="f-mile-memo"
                placeholder="메모 입력"></textarea>
            </div>

          </div><!-- /.form-row -->
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-modal="modal-mileage">취소</button>
        <button class="btn btn-primary" id="btn-mile-save">&#128190; 저장</button>
      </div>
    </div>
  </div>

  <!-- Add / Edit Trip Modal -->
  <div class="modal-overlay" id="modal-trip">
    <div class="modal-box modal-lg">
      <div class="modal-header">
        <div class="modal-title" id="modal-trip-title">&#128203; 출장 추가</div>
        <button class="modal-close" data-modal="modal-trip">&#x2715;</button>

  <!-- ===== SPINNER OVERLAY ===== -->
  <div class="spinner-overlay" id="spinner-overlay">
    <div class="spinner"></div>
    <div class="spinner-text" id="spinner-text">데이터를 불러오는 중...</div>
  </div>


<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script>
// ── Config ─────────────────────────────────────────────────────────────────
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzd9W_kqCdDWx27ySzBMffO51saNN28Po5XdNzvUat3SVLD-xO0sZ0ffc9g4h0Q1vdtrg/exec';
const ADMIN_PW = 'stoml';

// ── State ──────────────────────────────────────────────────────────────────
let allData = [], allTrips = [];
let selMile = new Set(), selTrip = new Set();
let editMileId = null, editTripId = null;
let curPerson = null, expFilter = null, chartInst = null;
let isAdmin = false;

// ── Helpers ────────────────────────────────────────────────────────────────
const todayMs = () => { const d = new Date(); d.setHours(0,0,0,0); return d.getTime(); };

function daysUntil(s) {
  if (!s) return Infinity;
  const d = new Date(s); d.setHours(0,0,0,0);
  return Math.round((d.getTime() - todayMs()) / 86400000);
}
function fmt(n) { if (n == null || n === '') return '-'; return Number(n).toLocaleString(); }
function fd(s) { if (!s) return '-'; const str = String(s); return str.length >= 10 ? str.substring(0, 10) : str; }

// ── Mileage rules ──────────────────────────────────────────────────────────
const isValid = r => r.is_valid_raw === '유효';
const isCalcSrc = r => r.source === '재단' || r.source === '주식회사';
const isEarn = r => r.category_raw === '적립';

function availMiles(rows) {
  return rows.filter(r => isValid(r) && isCalcSrc(r) && isEarn(r))
             .reduce((s, r) => s + (Number(r.available) || 0), 0);
}

function rowCls(r) {
  if (!isValid(r)) return 'row-gray';
  if (Number(r.available) === 0 && r.category_raw === '적립') return 'row-gray';
  if (Number(r.mileage) < 0) return 'row-strikethrough';
  const d = daysUntil(r.expire_date);
  if (d >= 0 && d <= 30)  return 'row-red';
  if (d > 30 && d <= 90)  return 'row-orange';
  if (d > 90 && d <= 180) return 'row-yellow';
  return '';
}

function expBadge(r) {
  const d = daysUntil(r.expire_date);
  if (d >= 0 && d <= 30)  return `<span class="badge badge-danger">D-${d}</span>`;
  if (d > 30 && d <= 90)  return `<span class="badge badge-warning">D-${d}</span>`;
  if (d > 90 && d <= 180) return `<span class="badge badge-info">D-${d}</span>`;
  return '';
}

function getExpRows(rows) {
  const earn = rows.filter(r => isValid(r) && isEarn(r) && Number(r.available) > 0);
  return {
    e30:  earn.filter(r => { const d = daysUntil(r.expire_date); return d >= 0 && d <= 30; }),
    e90:  earn.filter(r => { const d = daysUntil(r.expire_date); return d > 30 && d <= 90; }),
    e180: earn.filter(r => { const d = daysUntil(r.expire_date); return d > 90 && d <= 180; })
  };
}
function sumAvail(rows) { return rows.reduce((s,r) => s + (Number(r.available)||0), 0); }

// ── API ────────────────────────────────────────────────────────────────────
async function api(action, params = {}) {
  const url = new URL(SCRIPT_URL);
  url.searchParams.set('action', action);
  Object.entries(params).forEach(([k, v]) => url.searchParams.set(k, v ?? ''));
  const res = await fetch(url.toString());
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const json = await res.json();
  if (json.status === 'error') throw new Error(json.message || 'API error');
  return json;
}

// ── Loading ────────────────────────────────────────────────────────────────
function showLoad(msg) {
  document.getElementById('spinner-text').textContent = msg || '처리 중...';
  document.getElementById('spinner-overlay').style.display = 'flex';
}
function hideLoad() { document.getElementById('spinner-overlay').style.display = 'none'; }

// ── Toast ──────────────────────────────────────────────────────────────────
function toast(msg, type = 'success') {
  const c = document.getElementById('toast-container');
  const el = document.createElement('div');
  el.className = 'toast toast-' + type;
  el.textContent = msg;
  c.appendChild(el);
  setTimeout(() => el.classList.add('show'), 10);
  setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 300); }, 3200);
}

// ── Data load ──────────────────────────────────────────────────────────────
async function loadData() {
  showLoad('데이터를 불러오는 중...');
  try {
    const [m, t] = await Promise.all([api('getAll'), api('getTrips')]);
    allData = m.data || [];
    allTrips = t.data || [];
    buildFilters();
    updateExpBadge();
    refreshCurrentTab();
  } catch(e) { toast('데이터 로드 실패: ' + e.message, 'error'); }
  finally { hideLoad(); }
}

function buildFilters() {
  const airlines = [...new Set(allData.map(r => r.airline).filter(Boolean))].sort();
  const travelers = [...new Set(allData.map(r => r.traveler).filter(Boolean))].sort();
  const trips = [...new Set(allData.map(r => r.trip_title).filter(Boolean))].sort();
  const years = [...new Set(allTrips.map(r => String(r.year)).filter(Boolean))].sort().reverse();

  // Datalists for mileage form
  document.getElementById('list-airlines').innerHTML = airlines.map(a => `<option value="${a}">`).join('');
  document.getElementById('list-travelers').innerHTML = travelers.map(a => `<option value="${a}">`).join('');
  document.getElementById('list-trips').innerHTML = trips.map(a => `<option value="${a}">`).join('');
}

function updateExpBadge() {
  const { e30, e90, e180 } = getExpRows(allData);
  const cnt = e30.length + e90.length + e180.length;
  const badge = document.getElementById('badge-expiry');
  if (cnt > 0) { badge.textContent = cnt; badge.classList.remove('hidden'); }
  else badge.classList.add('hidden');
}

// ── Tab navigation ─────────────────────────────────────────────────────────
function activateTab(tabId) {
  document.querySelectorAll('.sidebar-tab').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.page-section').forEach(s => s.classList.remove('active'));

  const btn = document.querySelector(`[data-tab="${tabId}"]`);
  if (btn) btn.classList.add('active');

  // Determine parent page
  const pageId = btn ? btn.dataset.page : null;
  if (pageId) document.getElementById(pageId).classList.add('active');
  const section = document.getElementById(tabId);
  if (section) section.classList.add('active');

  renderTab(tabId);
}

function renderTab(id) {
  switch(id) {
    case 'tab-search':        renderSearchTab(); break;
    case 'tab-expiry':        renderExpiryTab(); break;
    case 'tab-airline-stats': renderAirlineStatTab(); break;
    case 'tab-trip-stats':    renderTripStatTab(); break;
    case 'tab-db-mileage':    renderDbMileTab(); break;
    case 'tab-db-trip':       renderDbTripTab(); break;
    case 'tab-db-person':     renderDbPersonTab(); break;
  }
}

function refreshCurrentTab() {
  const active = document.querySelector('.sidebar-tab.active');
  if (active) renderTab(active.dataset.tab);
}

// ── VIEW: 마일리지 조회 ────────────────────────────────────────────────────
function renderSearchTab() {
  const sec = document.getElementById('tab-search');
  sec.innerHTML = `
    <div class="section-header">
      <h2 class="section-title">🔍 마일리지 조회</h2>
    </div>
    <div class="search-bar" style="margin-bottom:24px">
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
        <input class="form-input" id="vsearch-q" placeholder="이름 검색..." style="width:260px;margin-bottom:0"
          onkeydown="if(event.key==='Enter')doVSearch()" list="list-travelers-vs">
        <datalist id="list-travelers-vs"></datalist>
        <button class="btn btn-primary" onclick="doVSearch()">검색</button>
        <button class="btn btn-secondary" onclick="clearVSearch()">초기화</button>
      </div>
    </div>
    <div id="vsearch-result" style="display:none"></div>
    <div id="vsearch-empty" class="empty-state">이름을 입력하고 검색하면 해당 직원의 마일리지 내역이 표시됩니다.</div>`;
  // populate datalist
  const travelers = [...new Set(allData.map(r => r.traveler).filter(Boolean))].sort();
  document.getElementById('list-travelers-vs').innerHTML = travelers.map(a => `<option value="${a}">`).join('');
}

function doVSearch() {
  const q = (document.getElementById('vsearch-q') || {value:''}).value.trim();
  if (!q) { toast('이름을 입력하세요', 'warning'); return; }
  const rows = allData.filter(r => r.traveler && r.traveler.includes(q));
  if (!rows.length) { toast('검색 결과가 없습니다', 'warning'); return; }
  document.getElementById('vsearch-result').style.display = '';
  document.getElementById('vsearch-empty').style.display = 'none';
  renderVSearchResult(q, rows);
}

function clearVSearch() {
  const q = document.getElementById('vsearch-q'); if(q) q.value = '';
  const r = document.getElementById('vsearch-result'); if(r) r.style.display = 'none';
  const e = document.getElementById('vsearch-empty'); if(e) e.style.display = '';
}

function renderVSearchResult(name, rows) {
  const alCards = renderAlCards(rows, false);
  const expHtml = renderExpCards(rows, false);
  const tableHtml = renderMileTable(rows);
  document.getElementById('vsearch-result').innerHTML = alCards + expHtml + `
    <div class="card" style="padding:0;overflow:hidden">
      <div style="padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px">
        <span style="font-weight:700;color:var(--text-muted);font-size:13px">📋 개인 내역</span>
        <input class="form-input" id="vsearch-rowq" placeholder="내역 필터..." style="width:160px;margin-bottom:0"
          oninput="filterVSearchRows('${name.replace(/'/g,"\\'")}')">
      </div>
      <div class="table-container"><table class="data-table">${mileTableHead()}
      <tbody id="vsearch-tbody">${mileTableRows(rows)}</tbody></table></div>
    </div>`;
}

function filterVSearchRows(name) {
  const q = (document.getElementById('vsearch-rowq')||{value:''}).value.toLowerCase();
  let rows = allData.filter(r => r.traveler && r.traveler.includes(name));
  if (q) rows = rows.filter(r => JSON.stringify(r).toLowerCase().includes(q));
  const tb = document.getElementById('vsearch-tbody');
  if (tb) tb.innerHTML = mileTableRows(rows);
}

function mileTableHead() {
  return `<thead><tr>
    <th>출발일</th><th>출장명</th><th>항공사</th><th>마일리지</th><th>잔여</th>
    <th>만료일</th><th>유효</th><th>구분</th><th>출처</th><th>메모</th>
  </tr></thead>`;
}

function mileTableRows(rows) {
  const sorted = [...rows].sort((a,b) => new Date(a.expire_date||0) - new Date(b.expire_date||0));
  return sorted.map(r => `
    <tr class="${rowCls(r)}">
      <td>${fd(r.depart_date)}</td><td>${r.trip_title||'-'}</td><td>${r.airline||'-'}</td>
      <td class="${Number(r.mileage)<0?'text-danger font-bold':'text-blue font-bold'}">${fmt(r.mileage)}</td>
      <td><strong class="text-blue">${fmt(r.available)}</strong></td>
      <td>${fd(r.expire_date)} ${expBadge(r)}</td>
      <td><span class="badge ${r.is_valid_raw==='유효'?'badge-success':'badge-secondary'}">${r.is_valid_raw||'-'}</span></td>
      <td>${r.category_raw||'-'}</td><td>${r.source||'-'}</td><td>${r.memo||'-'}</td>
    </tr>`).join('') || '<tr><td colspan="10" class="empty-state">내역 없음</td></tr>';
}

function renderAlCards(rows, clickable = true) {
  const valid = rows.filter(r => isValid(r) && isCalcSrc(r) && isEarn(r));
  const als = [...new Set(valid.map(r => r.airline).filter(Boolean))].sort();
  if (!als.length) return '';
  return `<div class="stats-grid" style="margin-bottom:20px">${als.map(a => {
    const m = availMiles(valid.filter(r => r.airline === a));
    return `<div class="card stat-card"><div class="stat-label">✈️ ${a}</div>
      <div class="stat-value">${fmt(m)}</div><div class="stat-sub">사용 가능 마일</div></div>`;
  }).join('')}</div>`;
}

function renderExpCards(rows, clickFn = false) {
  const {e30, e90, e180} = getExpRows(rows);
  return `<div class="expiry-cards" style="margin-bottom:20px">
    <div class="expiry-card expiry-red${clickFn?' clickable':''}" ${clickFn?`onclick="${clickFn}(30)"`:''}>
      <div class="expiry-label">30일 이내 소멸</div>
      <div class="expiry-count">${e30.length}건</div>
      <div class="expiry-miles">${fmt(sumAvail(e30))} 마일</div>
    </div>
    <div class="expiry-card expiry-orange${clickFn?' clickable':''}" ${clickFn?`onclick="${clickFn}(90)"`:''}>

function filterExpTable(days) {
  expFilter = days;
  const earn = allData.filter(r => isValid(r) && isEarn(r) && Number(r.available) > 0);
  let rows, title;
  if (days === 30) {
    rows = earn.filter(r => { const d = daysUntil(r.expire_date); return d >= 0 && d <= 30; });
    title = '📋 30일 이내 소멸 예정';
  } else if (days === 90) {
    rows = earn.filter(r => { const d = daysUntil(r.expire_date); return d > 30 && d <= 90; });
    title = '📋 31~90일 소멸 예정';
  } else if (days === 180) {
    rows = earn.filter(r => { const d = daysUntil(r.expire_date); return d > 90 && d <= 180; });
    title = '📋 91~180일 소멸 예정';
  } else {
    rows = earn.filter(r => { const d = daysUntil(r.expire_date); return d >= 0 && d <= 180; });
    title = '📋 소멸 예정 내역 (180일 이내)';
  }
  const titleEl = document.getElementById('exp-table-title');
  if (titleEl) titleEl.textContent = title;
  ['30','90','180'].forEach(d => {
    const el = document.getElementById('exp-card-' + d);
    if (el) el.style.outline = String(days) === d ? '2px solid var(--primary)' : 'none';
  });
  const sorted = [...rows].sort((a,b) => new Date(a.expire_date||0) - new Date(b.expire_date||0));
  const tbody = document.getElementById('exp-tbody');
  if (tbody) tbody.innerHTML = sorted.map(r => {
    const d = daysUntil(r.expire_date);
    const cls = d <= 30 ? 'row-red' : d <= 90 ? 'row-orange' : 'row-yellow';
    return `<tr class="${cls}">
      <td>${r.traveler||'-'}</td><td>${fd(r.depart_date)}</td><td>${r.trip_title||'-'}</td>
      <td>${r.airline||'-'}</td>
      <td><strong class="text-blue">${fmt(r.available)}</strong></td>
      <td>${fd(r.expire_date)}</td>
      <td><span class="badge ${d<=30?'badge-danger':d<=90?'badge-warning':'badge-info'}">D-${d}</span></td>
    </tr>`;
  }).join('') || '<tr><td colspan="7" class="empty-state">소멸 예정 내역 없음</td></tr>';
}

function getDMileRows() {
  const q = (document.getElementById('dm-q')||{value:''}).value.toLowerCase();
  const al = (document.getElementById('dm-airline')||{value:''}).value;
  const vl = (document.getElementById('dm-valid')||{value:''}).value;
  const ct = (document.getElementById('dm-cat')||{value:''}).value;
  return allData.filter(r => {
    if (q && !((r.traveler||'').toLowerCase().includes(q)||(r.trip_title||'').toLowerCase().includes(q))) return false;
    if (al && r.airline !== al) return false;
    if (vl && r.is_valid_raw !== vl) return false;
    if (ct && r.category_raw !== ct) return false;
    return true;
  });
}

  document.getElementById('f-mile-expire-date').value = fd(r.expire_date);

  document.getElementById('f-mile-category').value = r.category_raw || '적립';

async function saveMile() {
  const traveler = document.getElementById('f-mile-traveler').value.trim();
  const airline = document.getElementById('f-mile-airline').value.trim();
  if (!traveler || !airline) { toast('이름과 항공사는 필수입니다', 'warning'); return; }
  const p = {
    traveler, airline,
    depart_date: document.getElementById('f-mile-depart-date').value,
    trip_title: document.getElementById('f-mile-trip-title').value,
    mileage: document.getElementById('f-mile-mileage').value,
    available: document.getElementById('f-mile-available').value,
    expire_date: document.getElementById('f-mile-expire-date').value,
    is_valid_raw: document.getElementById('f-mile-is-valid').value,
    category_raw: document.getElementById('f-mile-category').value,
    source: document.getElementById('f-mile-source').value,
    memo: document.getElementById('f-mile-memo').value
  };
  try {
    showLoad('저장 중...');
    if (editMileId) { p.id = editMileId; await api('update', p); toast('수정 완료', 'success'); }
    else { await api('add', p); toast('추가 완료', 'success'); }
    closeModal('modal-mileage'); editMileId = null;
    await loadData(); renderDbMileTab();
  } catch(e) { toast('저장 실패: ' + e.message, 'error'); }

async function confirmUsageMulti() {
  const usageReason = document.getElementById('f-usage-reason').value;
  const updates = [];
  document.querySelectorAll('#usage-info-grid input[type=number]').forEach(inp => {
    const amt = Number(inp.value)||0;
    if (amt <= 0) return;
    updates.push({id: inp.dataset.id, avail: Number(inp.dataset.avail), amt});
  });
  if (!updates.length) { toast('사용량을 입력하세요', 'warning'); return; }
  if (updates.some(u => u.amt > u.avail)) { toast('잔여보다 많은 사용량이 있습니다', 'error'); return; }
  if (!confirm('사용내역을 저장하시겠습니까?')) return;
  try {
    showLoad('저장 중...');
    for (const u of updates) {
      await api('updateAvailable', {id: u.id, available: u.avail - u.amt});
      const r = allData.find(x => String(x.id) === String(u.id));
      if (r) await api('add', {
        traveler: r.traveler, depart_date: new Date().toISOString().slice(0,10),
        trip_title: usageReason || r.trip_title, airline: r.airline,
        mileage: -u.amt, available: 0, expire_date: r.expire_date,
        is_valid_raw: '유효', category_raw: '사용', source: r.source, memo: ''
      });
    }
    toast('사용내역 저장 완료', 'success');
    closeModal('modal-usage'); selMile.clear(); await loadData(); renderDbMileTab();
  } catch(e) { toast('저장 실패: ' + e.message, 'error'); } finally { hideLoad(); }
}

async function lookupTrip() {
  const trips = allTrips.filter(r => selTrip.has(String(r.id)) && r.trip_doc_no);

    const lbl = document.getElementById('trip-lookup-title');

    if (wrap) wrap.style.display = '';
  } catch(e) { toast('연동 조회 실패: ' + e.message, 'error'); } finally { hideLoad(); }
}

  const catF = (document.getElementById('dp-f-cat')||{value:''}).value;
  const allPRows = allData.filter(r => r.traveler === curPerson);
  let rows = allPRows;
  if (alF) rows = rows.filter(r => r.airline === alF);
  if (catF) rows = rows.filter(r => r.category_raw === catF);

  // Airline cards
  const valid = allPRows.filter(r => isValid(r) && isCalcSrc(r) && isEarn(r));
  const als = [...new Set(valid.map(r => r.airline).filter(Boolean))].sort();
  const alEl = document.getElementById('dp-al-cards');
  if (alEl) alEl.innerHTML = als.map(a => {
    const m = sumAvail(valid.filter(r => r.airline === a));
    return `<div class="card stat-card" style="cursor:pointer" onclick="document.getElementById('dp-f-airline').value='${a}';renderPersonDetail()">
      <div class="stat-label">✈️ ${a}</div><div class="stat-value text-blue">${fmt(m)}</div><div class="stat-sub">사용 가능 마일</div>
    </div>`;
  }).join('') || '<div class="empty-state">항공사 없음</div>';

  // Exp cards
  const {e30, e90, e180} = getExpRows(allPRows);
  const expEl = document.getElementById('dp-exp-cards');
  if (expEl) expEl.innerHTML = `
    <div class="expiry-card expiry-red clickable" onclick="document.getElementById('dp-f-cat').value='적립';renderPersonDetail()">
      <div class="expiry-label">30일 이내 소멸</div><div class="expiry-count">${e30.length}건</div><div class="expiry-miles">${fmt(sumAvail(e30))} 마일</div>
    </div>
    <div class="expiry-card expiry-orange">
      <div class="expiry-label">31~90일 소멸</div><div class="expiry-count">${e90.length}건</div><div class="expiry-miles">${fmt(sumAvail(e90))} 마일</div>
    </div>
    <div class="expiry-card expiry-yellow">
      <div class="expiry-label">91~180일 소멸</div><div class="expiry-count">${e180.length}건</div><div class="expiry-miles">${fmt(sumAvail(e180))} 마일</div>
    </div>`;

  // Table
  const sorted = [...rows].sort((a,b) => new Date(b.depart_date||0) - new Date(a.depart_date||0));
  const tb = document.getElementById('dp-tbody');
  if (tb) tb.innerHTML = mileTableRows(sorted);
}

// ── Password / Admin ───────────────────────────────────────────────────────
function openAdminModal() {
  document.getElementById('pw-input').value = '';
  const err = document.getElementById('pw-error');
  if (err) err.classList.add('hidden');
  openModal('modal-password');
  setTimeout(() => document.getElementById('pw-input').focus(), 100);
}

function checkPwd() {
  const val = document.getElementById('pw-input').value;
  if (val === ADMIN_PW) {
    closeModal('modal-password');
    enterAdmin();
  } else {
    const err = document.getElementById('pw-error'); if(err) err.classList.remove('hidden');
    document.getElementById('pw-input').value = '';
    document.getElementById('pw-input').focus();
  }
}

function enterAdmin() {
  isAdmin = true;
  document.getElementById('admin-indicator').classList.remove('hidden');
  document.getElementById('sidebar-db-section').style.display = '';
  document.getElementById('btn-open-sheet').style.display = '';
  document.getElementById('btn-admin-toggle').textContent = '🔓 나가기';
  document.getElementById('btn-admin-toggle').onclick = exitAdmin;
  // Switch to DB mileage tab
  activateTab('tab-db-mileage');
}

function exitAdmin() {
  isAdmin = false;
  document.getElementById('admin-indicator').classList.add('hidden');
  document.getElementById('sidebar-db-section').style.display = 'none';
  document.getElementById('btn-open-sheet').style.display = 'none';
  document.getElementById('btn-admin-toggle').textContent = '🔒 관리자';
  document.getElementById('btn-admin-toggle').onclick = openAdminModal;
  selMile.clear(); selTrip.clear();
  activateTab('tab-search');
}

// ── Modal utils ────────────────────────────────────────────────────────────
function openModal(id) { document.getElementById(id).classList.add('show'); }
function closeModal(id) { document.getElementById(id).classList.remove('show'); }

document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) m.classList.remove('show'); });
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') document.querySelectorAll('.modal-overlay.show').forEach(m => m.classList.remove('show'));
});
// Close buttons
document.querySelectorAll('.modal-close, [data-modal]').forEach(btn => {
  btn.addEventListener('click', () => {
    const id = btn.dataset.modal || btn.closest('.modal-overlay')?.id;
    if (id) closeModal(id);
  });
});

// ── Button wiring ──────────────────────────────────────────────────────────
document.getElementById('btn-admin-toggle').addEventListener('click', openAdminModal);
document.getElementById('btn-refresh').addEventListener('click', async () => { await loadData(); toast('새로고침 완료', 'success'); });
document.getElementById('btn-pw-confirm').addEventListener('click', checkPwd);
document.getElementById('btn-pw-cancel').addEventListener('click', () => closeModal('modal-password'));
document.getElementById('pw-input').addEventListener('keydown', e => { if(e.key === 'Enter') checkPwd(); });
document.getElementById('btn-mile-save').addEventListener('click', saveMile);
document.getElementById('btn-trip-save').addEventListener('click', saveTrip);

// Sidebar tabs
document.querySelectorAll('.sidebar-tab').forEach(btn => {
  btn.addEventListener('click', () => activateTab(btn.dataset.tab));
});

// Hide sheet button and DB section initially
document.getElementById('btn-open-sheet').style.display = 'none';
document.getElementById('sidebar-db-section').style.display = 'none';
